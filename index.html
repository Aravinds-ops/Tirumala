<style>
body{margin:0;font-family:Arial;background:#f3f3f3}

.card{
background:white;margin:12px;border-radius:14px;

.done{opacity:0.5;text-decoration:line-through}
input{width:100%;padding:8px;margin-top:6px}

<script>
function save(){localStorage.setItem("ultra_graphic",document.body.innerHTML);}
function load(){let d=localStorage.getItem("ultra_graphic");if(d)document.body.innerHTML=d;}
function toggle(id){document.getElementById(id).classList.toggle("done");save();}
function openMap(lat,long){window.open("https://maps.google.com/?q="+lat+","+long);}

function addMember(){
let n=document.getElementById("member").value;
if(!n)return;
let li=document.createElement("li");
li.textContent=n;
document.getElementById("members").appendChild(li);
save();
}

function calcFuel(){
let km=kmInput.value;
let mil=milInput.value;
let price=priceInput.value;
let fuel=km/mil;
let cost=fuel*price;
fuelResult.innerText="Fuel "+fuel.toFixed(1)+"L | ₹"+cost.toFixed(0);
}

if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}
</script>
</head>
